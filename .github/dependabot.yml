# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # npm dependencies (root)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    groups:
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
        # High-risk pre-1.0 / fast-moving packages excluded so each gets its
        # own PR instead of riding in the group bump (a single bad bump used
        # to block 38+ safe deps — see closed #125).
        exclude-patterns:
          - "@mariozechner/*"
          - "@agentclientprotocol/sdk"
          - "acpx"
          - "@buape/carbon"
          - "@tloncorp/*"
          - "@matrix-org/*"
          - "@lancedb/*"
          - "sqlite-vec"
          - "openai"
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # Docker base images
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      docker-images:
        patterns:
          - "*"
    open-pull-requests-limit: 5
